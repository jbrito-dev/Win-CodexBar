name: AgentBar installer

# Builds the unsigned AgentBar installer and publishes it as the GitHub
# release `v<version>` (the in-app updater reads this repository's latest
# release). Upstream's release.yml needs SignPath credentials and is pinned to
# nesszer/Win-CodexBar, so the fork uses this lighter pipeline instead.
# A rebuild of the same version replaces that release's assets.

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: fork-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    if: github.repository != 'nesszer/Win-CodexBar'
    name: Build installer
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      # Compiled into the app: the in-app updater compares (version, build).
      AGENTBAR_BUILD: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        shell: pwsh
        run: |
          npm install -g pnpm@11.25.0
          pnpm --version

      - name: Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install frontend dependencies
        run: pnpm --dir apps/desktop-tauri install --frozen-lockfile

      - name: Frontend tests (float bar)
        run: pnpm --dir apps/desktop-tauri exec vitest run src/floatbar src/switcher src/surfaces/settings/tabs/MenuTab.test.tsx

      - name: Build desktop app
        shell: pwsh
        run: |
          pnpm --dir apps/desktop-tauri exec tauri build --ci --no-bundle 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            # Surface compiler errors as annotations (readable via the API).
            $lines = Get-Content build.log
            $count = 0
            for ($i = 0; $i -lt $lines.Count -and $count -lt 10; $i++) {
              if ($lines[$i] -match '^error') {
                $block = ($lines[$i..([Math]::Min($i + 14, $lines.Count - 1))] -join "%0A")
                Write-Output "::error title=rustc::$block"
                $count++
              }
            }
            exit 1
          }

      - name: Build CLI
        run: cargo build --manifest-path rust/Cargo.toml --release --bin codexbar

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $line = Get-Content version.env | Where-Object { $_ -match '^MARKETING_VERSION=' }
          $version = $line.Split('=')[1].Trim()
          $short = "${{ github.sha }}".Substring(0, 7)
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "short=$short" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Stage binaries
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'stage'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item target/release/codexbar-desktop-tauri.exe (Join-Path $stage 'codexbar.exe')
          Copy-Item target/release/codexbar-desktop-tauri.exe (Join-Path $stage 'codexbar-desktop.exe')
          Copy-Item target/release/codexbar.exe (Join-Path $stage 'codexbar-cli.exe')
          Get-ChildItem $stage

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found after install" }

      - name: Download WebView2 bootstrapper
        shell: pwsh
        run: |
          $deps = Join-Path $env:RUNNER_TEMP 'installer-deps'
          New-Item -ItemType Directory -Force -Path $deps | Out-Null
          Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile (Join-Path $deps 'MicrosoftEdgeWebview2Setup.exe')

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          $version = '${{ steps.version.outputs.version }}'
          $out = Join-Path $env:GITHUB_WORKSPACE 'installer-out'
          Push-Location rust/installer
          & $iscc /Qp "/DAppVersion=$version" "/DTargetBinDir=$env:RUNNER_TEMP\stage" "/DWebView2BootstrapperPath=$env:RUNNER_TEMP\installer-deps\MicrosoftEdgeWebview2Setup.exe" "/DOutputDir=$out" "/DOutputBaseFilename=AgentBar-$version-ab.$env:AGENTBAR_BUILD-Setup" codexbar.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed: $LASTEXITCODE" }
          Pop-Location
          Copy-Item "$env:RUNNER_TEMP\stage\codexbar.exe" (Join-Path $out "AgentBar-$version-ab.$env:AGENTBAR_BUILD-portable.exe")
          Get-ChildItem $out

      - uses: actions/upload-artifact@v4
        with:
          name: AgentBar-installer-${{ steps.version.outputs.short }}
          path: installer-out/*.exe

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $build = $env:AGENTBAR_BUILD
          $tag = "v$version-ab.$build"
          $files = Get-ChildItem installer-out/*.exe | ForEach-Object { $_.FullName }
          $notes = "AgentBar $version build $build (${{ steps.version.outputs.short }}): Win-CodexBar $version plus the AgentBar changes in FORK.md. Installed copies update themselves from here (Settings > About). Unsigned: if SmartScreen warns, choose More info > Run anyway."
          gh release create $tag @files --repo '${{ github.repository }}' --target "${{ github.sha }}" --latest `
            --title "AgentBar $version (build $build)" --notes $notes
