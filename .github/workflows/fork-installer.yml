name: Fork installer

# Builds an unsigned Windows installer for this fork and publishes it as a
# GitHub pre-release. Upstream's release.yml needs SignPath credentials and is
# pinned to nesszer/Win-CodexBar, so forks use this lighter pipeline instead.

on:
  workflow_dispatch:
  push:
    branches:
      - feature/taskbar-detailed-meters

permissions:
  contents: write

concurrency:
  group: fork-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    if: github.repository != 'nesszer/Win-CodexBar'
    name: Build installer
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        shell: pwsh
        run: |
          npm install -g pnpm@11.25.0
          pnpm --version

      - name: Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install frontend dependencies
        run: pnpm --dir apps/desktop-tauri install --frozen-lockfile

      - name: Frontend tests (float bar)
        run: pnpm --dir apps/desktop-tauri exec vitest run src/floatbar src/switcher src/surfaces/settings/tabs/MenuTab.test.tsx

      - name: Build desktop app
        run: pnpm --dir apps/desktop-tauri exec tauri build --ci --no-bundle

      - name: Build CLI
        run: cargo build --manifest-path rust/Cargo.toml --release --bin codexbar

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $line = Get-Content version.env | Where-Object { $_ -match '^MARKETING_VERSION=' }
          $version = $line.Split('=')[1].Trim()
          $short = "${{ github.sha }}".Substring(0, 7)
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "short=$short" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Stage binaries
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'stage'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item target/release/codexbar-desktop-tauri.exe (Join-Path $stage 'codexbar.exe')
          Copy-Item target/release/codexbar-desktop-tauri.exe (Join-Path $stage 'codexbar-desktop.exe')
          Copy-Item target/release/codexbar.exe (Join-Path $stage 'codexbar-cli.exe')
          Get-ChildItem $stage

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found after install" }

      - name: Download WebView2 bootstrapper
        shell: pwsh
        run: |
          $deps = Join-Path $env:RUNNER_TEMP 'installer-deps'
          New-Item -ItemType Directory -Force -Path $deps | Out-Null
          Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile (Join-Path $deps 'MicrosoftEdgeWebview2Setup.exe')

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          $version = '${{ steps.version.outputs.version }}'
          $out = Join-Path $env:GITHUB_WORKSPACE 'installer-out'
          Push-Location rust/installer
          & $iscc /Qp "/DAppVersion=$version" "/DTargetBinDir=$env:RUNNER_TEMP\stage" "/DWebView2BootstrapperPath=$env:RUNNER_TEMP\installer-deps\MicrosoftEdgeWebview2Setup.exe" "/DOutputDir=$out" "/DOutputBaseFilename=CodexBar-$version-taskbar-meters-Setup" codexbar.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed: $LASTEXITCODE" }
          Pop-Location
          Copy-Item "$env:RUNNER_TEMP\stage\codexbar.exe" (Join-Path $out "CodexBar-$version-taskbar-meters-portable.exe")
          Get-ChildItem $out

      - uses: actions/upload-artifact@v4
        with:
          name: CodexBar-installer-${{ steps.version.outputs.short }}
          path: installer-out/*.exe

      - name: Publish pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "taskbar-meters-${{ steps.version.outputs.short }}"
          $files = Get-ChildItem installer-out/*.exe | ForEach-Object { $_.FullName }
          gh release create $tag @files --repo "${{ github.repository }}" --target "${{ github.sha }}" --prerelease `
            --title "CodexBar ${{ steps.version.outputs.version }} + taskbar detailed meters (${{ steps.version.outputs.short }})" `
            --notes "Unsigned fork build. Tray left-click: dark account switcher (Claude + Codex). Settings > Menu > Taskbar Meter > Show on Taskbar docks the meters on the taskbar (drag left/right)."
